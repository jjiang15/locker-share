  <ellipse cx="52" cy="62" rx="4.5" ry="8" transform="rotate(35 52 62)" fill="#a46a3c"/>
  <!-- head -->
  <circle cx="22" cy="31" r="7" fill="#a46a3c"/><circle cx="48" cy="31" r="7" fill="#a46a3c"/>
  <circle cx="22" cy="31" r="3.5" fill="#e4c29b"/><circle cx="48" cy="31" r="3.5" fill="#e4c29b"/>
  <circle cx="35" cy="46" r="18" fill="#a46a3c"/>
  <ellipse cx="35" cy="53" rx="9" ry="7" fill="#e4c29b"/>
  <circle cx="28" cy="43" r="2.6" fill="#3b2a20"/><circle cx="42" cy="43" r="2.6" fill="#3b2a20"/>
  <circle cx="28.9" cy="42.1" r=".9" fill="#fff"/><circle cx="42.9" cy="42.1" r=".9" fill="#fff"/>
  <ellipse cx="23" cy="51" rx="3.4" ry="2.2" fill="#ff8fa8" opacity=".6"/>
  <ellipse cx="47" cy="51" rx="3.4" ry="2.2" fill="#ff8fa8" opacity=".6"/>
