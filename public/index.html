<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bear Locker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bear Locker">
<meta name="theme-color" content="#fdf3e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a1f19" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf3e7; --card: #fffaf3; --text: #5a3e2b; --muted: #a48670; --line: #f0dcc4;
    --honey: #f5b95f; --honey-2: #f9d08b; --honey-ink: #6b3f12;
    --pink: #ff8fb1; --blush: #ffe6ee; --blush-ink: #c2477a; --mint: #5fa86b;
    --shadow: 0 6px 0 #f0dcc4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a1f19; --card: #362820; --text: #f6e6d4; --muted: #b89b82; --line: #4a3628;
      --honey: #e9a94e; --honey-2: #f2c071; --honey-ink: #3a220c;
      --pink: #ff9eb8; --blush: #4a2b33; --blush-ink: #ffb3c9; --mint: #8fd08f;
      --shadow: 0 6px 0 #1e1612;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 500 16px/1.4 Fredoka, ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);
  }
  main { max-width: 440px; margin: 0 auto; }

  /* header */
  header { text-align: center; margin-bottom: 16px; }
  .pair { display: flex; justify-content: center; align-items: flex-end; gap: 2px; }
  .pair svg { width: 64px; height: 68px; }
  .pair .heart { color: var(--pink); font-size: 22px; margin-bottom: 26px; animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  h1 { font-size: 26px; font-weight: 700; margin: 4px 0 2px; }
  .hi { background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; padding: 4px 10px; }
  .hi u { text-decoration-style: dotted; text-underline-offset: 3px; }

  /* cards */
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 26px;
    padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .honey {
    background: linear-gradient(160deg, var(--honey-2), var(--honey)); border-color: transparent;
    color: var(--honey-ink);
  }
  .paws { position: absolute; right: -6px; top: -6px; opacity: .18; width: 110px; pointer-events: none; }
  .pill {
    display: inline-block; background: rgba(255,255,255,.55); color: var(--honey-ink);
    border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 600;
  }
  .label { font-size: 13px; font-weight: 600; letter-spacing: .04em; opacity: .75; margin-top: 12px; }
  .code { font-size: 44px; font-weight: 700; letter-spacing: .06em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .loc { font-size: 16px; margin-top: 6px; }

  .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .day-head h2 { font-size: 20px; font-weight: 700; margin: 0; }
  .date { background: var(--bg); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .free { display: flex; align-items: center; gap: 8px; color: var(--mint); font-weight: 600; padding: 6px 0 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .row .ava { width: 42px; height: 42px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; flex: none; }
  .row .ava svg { width: 36px; height: 38px; }
  .row .txt { flex: 1; }
  .row .sub { color: var(--muted); font-size: 13px; }
  .badge { background: var(--honey-2); color: var(--honey-ink); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .heads-up {
    background: var(--blush); color: var(--blush-ink); border-radius: 16px;
    padding: 9px 12px; font-size: 14px; margin: 8px 0 4px;
  }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .q { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 14px; }
  button.cancel {
    display: block; margin: 10px auto 0; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  button.b {
    flex: 1; padding: 13px 8px; border-radius: 999px; border: 2px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-weight: 600; font-size: 16px; cursor: pointer;
    transition: transform .08s;
  }
  button.b:active { transform: scale(.96); }
  button.b.primary { background: var(--honey); border-color: var(--honey); color: var(--honey-ink); box-shadow: 0 4px 0 #d9913a; }
  button.b:disabled { opacity: .5; }
  .hl { border-color: var(--honey); }

  .foot { text-align: center; color: var(--muted); font-size: 14px; }
  .foot button {
    background: var(--blush); color: var(--blush-ink); border: 0; border-radius: 999px;
    font: inherit; font-weight: 600; padding: 10px 18px; cursor: pointer;
  }
  .foot p { margin: 10px 0 0; }
  .hidden { display: none !important; }

  /* dialog */
  dialog {
    border: 0; border-radius: 28px; padding: 22px; width: min(92vw, 400px);
    background: var(--card); color: var(--text); text-align: center;
  }
  dialog::backdrop { background: rgba(60,35,20,.45); }
  dialog h3 { margin: 0 0 4px; font-size: 22px; }
  dialog .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  dialog label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  dialog input {
    width: 100%; padding: 12px; border-radius: 16px; border: 2px solid var(--line); text-align: center;
    background: var(--bg); color: var(--text); font: inherit; font-size: 20px; letter-spacing: .2em;
  }
  .pick { display: flex; gap: 12px; }
  .pick button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 6px 12px; border-radius: 22px; border: 2px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-weight: 600; font-size: 17px; cursor: pointer;
    transition: transform .1s;
  }
  .pick button:active { transform: scale(.95); }
  .pick button svg { width: 86px; height: 92px; }
  .pick button.on { border-color: var(--honey); }
  .err { color: var(--blush-ink); font-size: 14px; margin-top: 10px; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <header>
    <div class="pair" id="pair"></div>
    <h1>Our Little Locker</h1>
    <button class="hi hidden" id="hiBtn"></button>
  </header>

  <section class="card honey">
    <svg class="paws" viewBox="0 0 100 100" aria-hidden="true" fill="currentColor">
      <g id="paw"><ellipse cx="30" cy="40" rx="11" ry="9"/><circle cx="17" cy="27" r="5"/><circle cx="25" cy="20" r="5"/><circle cx="35" cy="20" r="5"/><circle cx="43" cy="27" r="5"/></g>
      <use href="#paw" x="40" y="35"/>
    </svg>
    <span class="pill" id="num">Locker</span>
    <div class="label">COMBINATION</div>
    <div class="code" id="code">—</div>
    <div class="loc" id="loc"></div>
  </section>

  <section class="card" id="card-today"></section>
  <section class="card" id="card-tomorrow"></section>

  <div class="foot">
    <button id="notifyBtn" class="hidden">🔔 Turn on nightly reminders</button>
    <p id="installTip" class="hidden">For reminders: Share → <b>Add to Home Screen</b>, then open it from there 🐾</p>
    <p id="offline" class="hidden">Offline, showing last saved info</p>
  </div>
</main>

<dialog id="setup">
  <form method="dialog" id="setupForm">
    <h3>Welcome! 🍯</h3>
    <div class="sub">Our shared locker at Huntsman</div>
    <label for="pinIn">App PIN</label>
    <input id="pinIn" inputmode="numeric" autocomplete="off">
    <label>Which bear are you?</label>
    <div class="pick" id="setupPick"></div>
    <div class="err" id="setupErr"></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const PEOPLE = ['Janna Jiang', 'David Zhang'];
const first = (who) => who.split(' ')[0];

function bear(who) {
  const janna = who === 'Janna Jiang';
  const fur = janna ? '#e9b27a' : '#a46a3c';
  const light = janna ? '#f9e1c6' : '#e4c29b';
  const dark = '#3b2a20';
  const extra = janna
    // pink bow + eyelashes
    ? `<path d="M67 6 L81 15 L67 24 Z M95 6 L81 15 L95 24 Z" fill="#ff8fb1"/>
       <circle cx="81" cy="15" r="4" fill="#ff5a99"/>
       <path d="M31 45 l-3 -3 M35 44 l-1 -4 M65 44 l1 -4 M69 45 l3 -3" stroke="${dark}" stroke-width="1.6" stroke-linecap="round"/>`
    // blue bow tie
    : `<path d="M50 94 L36 86 L36 102 Z M50 94 L64 86 L64 102 Z" fill="#5b8ee0"/>
       <circle cx="50" cy="94" r="4" fill="#3a6cc4"/>`;
  return `<svg viewBox="0 0 100 106" aria-hidden="true">
    <circle cx="24" cy="26" r="14" fill="${fur}"/><circle cx="76" cy="26" r="14" fill="${fur}"/>
    <circle cx="24" cy="26" r="7" fill="${light}"/><circle cx="76" cy="26" r="7" fill="${light}"/>
    <circle cx="50" cy="56" r="36" fill="${fur}"/>
    <ellipse cx="50" cy="68" rx="17" ry="13" fill="${light}"/>
    <circle cx="36" cy="51" r="4.5" fill="${dark}"/><circle cx="64" cy="51" r="4.5" fill="${dark}"/>
    <circle cx="37.5" cy="49.5" r="1.5" fill="#fff"/><circle cx="65.5" cy="49.5" r="1.5" fill="#fff"/>
    <ellipse cx="27" cy="63" rx="6" ry="4" fill="#ff8fa8" opacity=".55"/>
    <ellipse cx="73" cy="63" rx="6" ry="4" fill="#ff8fa8" opacity=".55"/>
    <ellipse cx="50" cy="62" rx="6" ry="4.5" fill="${dark}"/>
    <path d="M44 69 Q50 75 56 69" stroke="${dark}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${extra}
  </svg>`;
}

$('pair').innerHTML = bear('Janna Jiang') + '<span class="heart">♥</span>' + bear('David Zhang');

let me = store.get('me');
if (me && !PEOPLE.includes(me)) me = null;
let pin = store.get('pin');
let state = null;
const focusDay = new URLSearchParams(location.search).get('day');

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', 'x-pin': pin || '' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) throw Object.assign(new Error('Wrong PIN'), { auth: true });
  if (!r.ok) throw new Error('Request failed');
  return r.json();
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nth = (i) => ['1st', '2nd', '3rd'][i] ?? `${i + 1}th`;

function renderDay(day) {
  const { date, list } = state[day];
  const mine = list.find((r) => r.who === me);
  const others = list.filter((r) => r.who !== me);
  const el = $('card-' + day);
  el.classList.toggle('hl', focusDay === day);

  const rows = list.length
    ? list.map((r, i) => `<div class="row">
        <div class="ava">${PEOPLE.includes(r.who) ? bear(r.who) : '🐻'}</div>
        <div class="txt">${r.who === me ? 'You' : esc(first(r.who))} · ${r.size}
          <div class="sub">since ${fmtTime(r.at)}</div></div>
        ${list.length > 1 ? `<span class="badge">${nth(i)}</span>` : ''}
      </div>`).join('')
    : '<div class="free">🍯 Free, all yours!</div>';

  let headsUp = '';
  if (others.length && !mine) {
    headsUp = `<div class="heads-up">🐾 ${others.map((r) => esc(first(r.who))).join(' & ')} already has it (${others.map((r) => r.size).join(', ')}). You can still squeeze in!</div>`;
  } else if (others.length && mine && others[0].at < mine.at) {
    headsUp = `<div class="heads-up">🐾 ${esc(first(others[0].who))} got there first, so share nicely!</div>`;
  }

  const sizes = ['Small', 'Medium', 'Large'].map((s) => {
    const cls = !mine ? 'primary' : s === mine.size ? 'primary' : '';
    return `<button class="b ${cls}" data-act="reserve" data-size="${s}">${s}</button>`;
  }).join('');
  const btns = `<div class="q">What size item are you storing?</div>
    <div class="btns">${sizes}</div>
    ${mine ? '<button class="cancel" data-act="cancel">Cancel my spot</button>' : ''}`;

  el.innerHTML = `
    <div class="day-head"><h2>${day === 'today' ? '☀️ Today' : '🌙 Tomorrow'}</h2><span class="date">${fmtDate(date)}</span></div>
    ${rows}${headsUp}
    ${btns}`;
  el.querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (mine && b.dataset.size === mine.size) return;
    act(day, b.dataset.act, b.dataset.size, el);
  });
}

function render() {
  if (me) {
    $('hiBtn').innerHTML = `Hi ${first(me)}! <u>Not you?</u>`;
    $('hiBtn').classList.remove('hidden');
  }
  if (!state) return;
  const { number, code, location: loc } = state.info;
  $('num').textContent = `Locker #${number}`;
  $('code').textContent = code || '—';
  $('loc').textContent = '📍 ' + loc;
  renderDay('today');
  renderDay('tomorrow');
  updateNotifyUi();
}

async function load() {
  try {
    state = await api('/api/state');
    store.set('state', JSON.stringify(state));
    $('offline').classList.add('hidden');
  } catch (e) {
    if (e.auth) return showSetup('Hmm, wrong PIN 🐻');
    const cached = store.get('state');
    if (cached) { state = JSON.parse(cached); $('offline').classList.remove('hidden'); }
  }
  render();
}

async function act(day, action, size, el) {
  el.querySelectorAll('button').forEach((b) => b.disabled = true);
  try {
    state = await api('/api/state', { action, day, size, who: me });
    store.set('state', JSON.stringify(state));
  } catch { alert('Could not save. Check your connection.'); }
  render();
}

// --- setup / switch bear ---
function showSetup(err = '') {
  $('setupErr').textContent = err;
  $('pinIn').value = pin || '';
  const pick = $('setupPick');
  pick.innerHTML = PEOPLE.map((p) =>
    `<button type="button" data-who="${p}" class="${p === me ? 'on' : ''}">${bear(p)}<span>${first(p)}</span></button>`).join('');
  pick.querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (!$('pinIn').value.trim()) { $('setupErr').textContent = 'Enter the PIN first 🐾'; return; }
    pin = $('pinIn').value.trim();
    me = b.dataset.who;
    store.set('pin', pin); store.set('me', me);
    $('setup').close();
    load().then(syncPush);
  });
  $('setup').showModal();
}
$('setupForm').onsubmit = (e) => e.preventDefault();
$('hiBtn').onclick = () => showSetup();

// --- push notifications ---
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

function updateNotifyUi() {
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  $('installTip').classList.toggle('hidden', !(isIOS && !standalone));
  $('notifyBtn').classList.toggle('hidden', !(pushSupported && state?.vapidKey && Notification.permission === 'default'));
}

function b64ToBytes(b64) {
  const s = atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

async function syncPush() {
  if (!pushSupported || !state?.vapidKey || Notification.permission !== 'granted' || !me) return;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription()
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(state.vapidKey) });
  await api('/api/subscribe', { who: me, sub: sub.toJSON() }).catch(() => {});
}

$('notifyBtn').onclick = async () => {
  const p = await Notification.requestPermission();
  updateNotifyUi();
  if (p === 'granted') syncPush();
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
document.addEventListener('visibilitychange', () => { if (!document.hidden && me) load(); });

if (!me) showSetup();
else load().then(syncPush);
</script>
</body>
</html>
